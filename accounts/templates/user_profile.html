<!DOCTYPE html>
<html lang="sw"">
<head>
  <meta charset="UTF-8" />
  <title>Client Profile | KRCO-DM</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center">
<div class="bg-white rounded-xl shadow-lg w-full max-w-2xl p-8">
  <h1 class="text-2xl font-bold text-yellow-600 mb-4">Client Profile</h1>

  <div class="space-y-4">
    <div>
      <label class="block text-sm text-gray-600">Jina Kamili</label>
      <p class="font-semibold text-lg text-gray-800">{{request.user.first_name}} {{request.user.middle_name}} {{request.user.last_name}}</p>
    </div>

    <div>
      <label class="block text-sm text-gray-600">Idara</label>
      <p class="text-gray-700">{{department}}</p>
    </div>
  </div>

  <div class="mt-6 flex justify-between">
    <a href="/client_dashboard" class="text-yellow-600 hover:underline">Rudi kwenye dashbodi</a>
    <form th:action="@{/client_logout}" method="post">
        {% csrf_token %}
      <button class="bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded-md">Ondoka</button>
    </form>
  </div>
</div>
</body>
</html>
