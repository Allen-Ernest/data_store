<!DOCTYPE html>
<html lang="sw">

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jisajili | KRCO-DS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <style>
        body {
            font-family: 'Montserrat', sans-serif;
        }
    </style>
</head>

<body class="bg-gray-100 min-h-screen flex flex-col">
    <main class="flex flex-grow items-center justify-center px-4">
        <form method="post" action="{% url 'register_client' %}" enctype="multipart/form-data" class=" bg-white p-6 rounded shadow-md w-full max-w-lg">
            <h2 class="text-center mb-1">Jisajili | KRCO-DS</h2>
            {% csrf_token %}
            <div class="grid grid-cols-3 gap-3 mb-2">
                <input type="text" name="first_name" class="border px-3 py-2 rounded focus:ring-2 focus:ring-blue-400" placeholder="Jina la Kwanza">
                <input type="text" name="middle_name" class="border px-3 py-2 rounded focus:ring-2 focus:ring-blue-400" placeholder="Jina la Kati">
                <input type="text" name="last_name" class="border px-3 py-2 rounded focus:ring-2 focus:ring-blue-400" placeholder="Jina la Mwisho">
            </div>

            <input type="email" name="email"  class="w-full mb-3 border px-3 py-2 rounded focus:ring-2 focus:ring-blue-400"  placeholder="Anwani ya barua pepe">

            <select name="department"  class="mb-3 w-full border px-3 py-2 rounded focus:ring-2 focus:ring-blue-400">
                <option value="" disabled selected>Chagua Idara</option>
                {% if departments %}
                {% for department in departments %}
                <option value="{{ department.id }}">{{department.name}} ({{department.code}})</option>
                {% endfor %}
                {% else %}
                <option value="" disabled selected>Default</option>
                {% endif %}
            </select>
            <input type="password" id="password" name="password"  class="w-full mb-3 border px-3 py-2 rounded focus:ring-2 focus:ring-blue-400"  placeholder="Nywila">
            <input type="password" id="confirm_password" name="confirm_password"  class="w-full mb-3 border px-3 py-2 rounded focus:ring-2 focus:ring-blue-400"  placeholder="Hakiki Nywila">
            <div class="hidden rounded bg-red-50 border-2 border-red-500"><p id="feedback" class="text-center text-red-500"></p></div>
            <button disabled type="submit"
                class="mt-3 text-white rounded p-1 w-full bg-yellow-600 hover:bg-white hover:text-yellow-600 hover:border-2 hover:border-yellow-600 disabled:opacity-50">Jisajili</button>
            <h3 class="mt-3 text-center">Tayari umesajiliwa? <a href="#" class="text-yellow-600">Ingia</a></h3>
        </form>
    </main>
    <footer class="bg-yellow-600 w-full text-white text-center p-4">
        &copy; 2024 KRCO-DS™️
    </footer>
    <script>
        const password = document.getElementById('password');
        const confirm_password = document.getElementById('confirm_password');
        const feedback = document.getElementById('feedback');
        const submitButton = document.querySelector('button[type="submit"]');

        function validatePassword() {
            if (password.value === '' || confirm_password.value === '') {
                feedback.textContent = '';
                feedback.parentElement.classList.add('hidden');
                submitButton.disabled = true;
                return;
            }

            if (password.value === confirm_password.value) {
                feedback.textContent = 'Nywila zinalingana';
                feedback.classList.remove('text-red-500');
                feedback.classList.add('text-green-500');
                feedback.parentElement.classList.remove('hidden');
                feedback.parentElement.classList.remove('bg-red-50')
                feedback.parentElement.classList.remove('bg-red-500')
                feedback.parentElement.classList.add('bg-green-50')
                feedback.parentElement.classList.add('border-green-500')
                submitButton.disabled = false;
            } else {
                feedback.textContent = 'Nywila hazilingani';
                feedback.classList.remove('text-green-500');
                feedback.classList.add('text-red-500');
                feedback.parentElement.classList.remove('hidden');
                submitButton.disabled = true;
            }
        }

        password.addEventListener('input', validatePassword);
        confirm_password.addEventListener('input', validatePassword);
        </script>
</body>

</html>
